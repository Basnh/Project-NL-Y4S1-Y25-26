<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết User - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/layout.css">
</head>
<body class="bg-gray-100 font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1">
        <div class="min-h-screen bg-gray-100 py-10 px-6">
            <div class="max-w-6xl mx-auto">
                <div th:replace="~{fragments/header(title='Chi tiết: ' + ${user.username}, icon='fas fa-user-circle')}"></div>
                
                <!-- Success Alert -->
                <div th:if="${message != null}" class="bg-green-100 border border-green-400 text-green-700 px-6 py-4 rounded-lg mb-6 flex items-center shadow-sm">
                    <i class="fas fa-check-circle mr-3"></i>
                    <span th:text="${message}"></span>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Left Column: User Info & Activity -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- User Info Card -->
                        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">
                            <h2 class="text-2xl font-bold mb-6 flex items-center">
                                <i class="fas fa-user text-indigo-600 mr-3"></i>
                                Thông tin User
                            </h2>
                            
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">ID</label>
                                    <p class="text-lg font-semibold text-gray-900" th:text="${user.id}">1</p>
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Username</label>
                                    <div class="flex items-center space-x-3">
                                        <img src="/images/avatar-default.png" alt="Avatar" class="w-8 h-8 rounded-full border border-gray-300" />
                                        <p class="text-lg font-semibold text-gray-900" th:text="${user.username}">user1</p>
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Họ tên</label>
                                    <p class="text-lg font-semibold text-gray-900" th:text="${user.fullName}">John Doe</p>
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Email</label>
                                    <p class="text-lg font-semibold text-gray-900" th:text="${user.email}">user@example.com</p>
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Số điện thoại</label>
                                    <p class="text-lg font-semibold text-gray-900" th:text="${user.phoneNumber ?: 'N/A'}">N/A</p>
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Role</label>
                                    <div class="mt-2">
                                        <span th:if="${user.admin}" class="inline-flex items-center px-4 py-2 bg-purple-100 text-purple-800 rounded-lg text-sm font-semibold">
                                            <i class="fas fa-crown mr-2"></i> Admin
                                        </span>
                                        <span th:if="!${user.admin}" class="inline-flex items-center px-4 py-2 bg-blue-100 text-blue-800 rounded-lg text-sm font-semibold">
                                            <i class="fas fa-user-circle mr-2"></i> User
                                        </span>
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Trạng thái</label>
                                    <div class="mt-2">
                                        <span th:if="${user.active}" class="inline-flex items-center px-4 py-2 bg-green-100 text-green-800 rounded-lg text-sm font-semibold">
                                            <i class="fas fa-check-circle mr-2"></i> Active
                                        </span>
                                        <span th:if="!${user.active}" class="inline-flex items-center px-4 py-2 bg-red-100 text-red-800 rounded-lg text-sm font-semibold">
                                            <i class="fas fa-ban mr-2"></i> Inactive
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Activity History Card -->
                        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">
                            <h2 class="text-2xl font-bold mb-6 flex items-center">
                                <i class="fas fa-history text-indigo-600 mr-3"></i>
                                Lịch sử hoạt động
                            </h2>
                            
                            <div class="space-y-3 max-h-96 overflow-y-auto">
                                <div th:each="activity : ${activities.content}" class="p-4 bg-gradient-to-r from-gray-50 to-gray-100 border border-gray-200 rounded-lg hover:shadow-md transition-shadow">
                                    <div class="flex items-start justify-between mb-2">
                                        <div class="flex items-start space-x-3">
                                            <div th:classappend="${activity.getStatusBadgeClass()}" class="p-2.5 rounded-lg text-sm flex-shrink-0">
                                                <i th:class="'fas ' + ${activity.getActionIcon()}"></i>
                                            </div>
                                            <div class="flex-1">
                                                <div class="font-semibold text-gray-900">
                                                    <span th:text="${activity.action}">ACTION</span>
                                                    <span th:if="${activity.status}" th:classappend="${activity.getStatusBadgeClass()}" class="ml-2 px-2.5 py-1 text-xs font-semibold rounded-full">
                                                        <i th:if="${activity.status == 'SUCCESS'}" class="fas fa-check mr-1"></i>
                                                        <i th:if="${activity.status == 'FAILED'}" class="fas fa-times mr-1"></i>
                                                        <i th:if="${activity.status == 'PENDING'}" class="fas fa-hourglass-half mr-1"></i>
                                                        <span th:text="${activity.status}">Status</span>
                                                    </span>
                                                </div>
                                                <p class="text-sm text-gray-700 mt-1" th:text="${activity.description}">Activity description</p>
                                                <p th:if="${activity.details}" class="text-xs text-gray-600 mt-2 bg-white p-2.5 rounded border border-gray-200">
                                                    <strong>Chi tiết:</strong> <span th:text="${activity.details}"></span>
                                                </p>
                                            </div>
                                        </div>
                                        <div class="text-right flex-shrink-0">
                                            <div class="text-xs text-gray-500 font-medium">
                                                <i class="fas fa-clock mr-1"></i>
                                                <span th:text="${activity.getFormattedDate()}">12/11/2024 10:30:45</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <p th:if="${#lists.isEmpty(activities.content)}" class="text-gray-500 text-center py-8">
                                    <i class="fas fa-inbox text-3xl text-gray-300 mb-2"></i>
                                    <p>Chưa có hoạt động nào</p>
                                </p>
                            </div>
                            
                            <!-- Pagination -->
                            <div th:if="${activities.totalPages > 1}" class="mt-6 flex justify-center items-center space-x-2">
                                <a th:if="${activities.hasPrevious()}" 
                                   th:href="'/admin/users/' + ${user.id} + '?page=' + ${currentPage - 1}"
                                   class="px-3 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors text-sm">
                                    <i class="fas fa-chevron-left"></i> Trước
                                </a>
                                
                                <div class="space-x-1">
                                    <a th:each="i : ${#numbers.sequence(0, activities.totalPages - 1)}"
                                       th:if="${i != currentPage}"
                                       th:href="'/admin/users/' + ${user.id} + '?page=' + ${i}"
                                       class="px-2.5 py-1.5 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors text-sm inline-block">
                                        <span th:text="${i + 1}">1</span>
                                    </a>
                                    <span th:each="i : ${#numbers.sequence(0, activities.totalPages - 1)}"
                                          th:if="${i == currentPage}" class="px-2.5 py-1.5 bg-indigo-600 text-white rounded-lg text-sm inline-block">
                                        <span th:text="${i + 1}">1</span>
                                    </span>
                                </div>
                                
                                <a th:if="${activities.hasNext()}" 
                                   th:href="'/admin/users/' + ${user.id} + '?page=' + ${currentPage + 1}"
                                   class="px-3 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors text-sm">
                                    Sau <i class="fas fa-chevron-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right Column: Actions -->
                    <div class="space-y-6">
                        <!-- Actions Card -->
                        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">
                            <h2 class="text-xl font-bold mb-6 flex items-center">
                                <i class="fas fa-cog text-indigo-600 mr-3"></i>
                                Hành động
                            </h2>
                            
                            <div class="space-y-3">
                                <!-- Make Admin -->
                                <form th:if="!${user.admin}" method="POST" th:action="'/admin/users/' + ${user.id} + '/make-admin'" onsubmit="return confirm('Bạn chắc chắn muốn cấp quyền admin?');">
                                    <button type="submit" class="w-full inline-flex items-center justify-center px-4 py-3 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 transition-colors duration-200 shadow hover:shadow-md text-sm">
                                        <i class="fas fa-crown mr-2"></i> Cấp quyền Admin
                                    </button>
                                </form>
                                
                                <!-- Remove Admin -->
                                <form th:if="${user.admin}" method="POST" th:action="'/admin/users/' + ${user.id} + '/remove-admin'" onsubmit="return confirm('Bạn chắc chắn muốn hạ quyền?');">
                                    <button type="submit" class="w-full inline-flex items-center justify-center px-4 py-3 bg-orange-600 text-white font-semibold rounded-lg hover:bg-orange-700 transition-colors duration-200 shadow hover:shadow-md text-sm">
                                        <i class="fas fa-user-slash mr-2"></i> Hạ quyền Admin
                                    </button>
                                </form>
                                
                                <!-- Deactivate -->
                                <form th:if="${user.active}" method="POST" th:action="'/admin/users/' + ${user.id} + '/deactivate'" onsubmit="return confirm('Bạn chắc chắn muốn vô hiệu hóa tài khoản?');">
                                    <button type="submit" class="w-full inline-flex items-center justify-center px-4 py-3 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition-colors duration-200 shadow hover:shadow-md text-sm">
                                        <i class="fas fa-ban mr-2"></i> Vô hiệu hóa
                                    </button>
                                </form>
                                
                                <!-- Activate -->
                                <form th:if="!${user.active}" method="POST" th:action="'/admin/users/' + ${user.id} + '/activate'" onsubmit="return confirm('Bạn chắc chắn muốn kích hoạt tài khoản?');">
                                    <button type="submit" class="w-full inline-flex items-center justify-center px-4 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition-colors duration-200 shadow hover:shadow-md text-sm">
                                        <i class="fas fa-check-circle mr-2"></i> Kích hoạt
                                    </button>
                                </form>
                                
                                <hr class="my-4">
                                
                                <!-- Back Button -->
                                <a href="/admin/users" class="w-full inline-flex items-center justify-center px-4 py-3 bg-gray-600 text-white font-semibold rounded-lg hover:bg-gray-700 transition-colors duration-200 shadow hover:shadow-md text-sm">
                                    <i class="fas fa-arrow-left mr-2"></i> Quay lại
                                </a>
                            </div>
                        </div>
                        
                        <!-- Servers Card -->
                        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">
                            <h2 class="text-xl font-bold mb-4 flex items-center">
                                <i class="fas fa-server text-indigo-600 mr-3"></i>
                                Servers
                            </h2>
                            
                            <p class="text-sm text-gray-600 mb-4" th:text="'Tổng: ' + ${#lists.size(servers)} + ' servers'">Tổng: 0 servers</p>
                            
                            <div class="space-y-2 max-h-64 overflow-y-auto">
                                <div th:each="server : ${servers}" class="p-3 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg border border-blue-200 text-sm hover:shadow-md transition-shadow">
                                    <div class="font-semibold text-gray-900 flex items-center">
                                        <i class="fas fa-server text-indigo-600 mr-2"></i>
                                        <span th:text="${server.name}">Server 1</span>
                                    </div>
                                    <div class="text-gray-600 text-xs mt-1">
                                        <i class="fas fa-network-wired text-gray-400 mr-1"></i>
                                        <span th:text="${server.ip}">192.168.1.1</span>
                                    </div>
                                </div>
                                <p th:if="${#lists.isEmpty(servers)}" class="text-gray-500 text-sm text-center py-6">
                                    <i class="fas fa-inbox text-2xl text-gray-300 mb-2"></i>
                                    <p>Chưa có servers</p>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer}"></div>
</body>
</html>
