spring.application.name=sshcontrol

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sshcontrol_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Enable DevTools for auto-reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**,resources/**

# Thymeleaf development settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Web resources development settings
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ============ LOGGING CONFIGURATION ============
# Chỉ hiển thị log từ ứng dụng của bạn, tắt log từ các thư viện
logging.level.root=WARN
logging.level.com.example.sshcontrol=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=WARN
logging.level.org.springframework.data=WARN
logging.level.org.apache.catalina=WARN
logging.level.com.zaxxer.hikari=WARN

# Tắt DevTools property logs
logging.level.org.springframework.boot.devtools=ERROR

# Format log đơn giản hơn
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
