spring.application.name=sshcontrol

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sshcontrol_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Enable DevTools for auto-reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**,resources/**

# Thymeleaf development settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Web resources development settings
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ============ LOGGING CONFIGURATION ============
# Chỉ hiển thị log từ ứng dụng của bạn, tắt log từ các thư viện
logging.level.root=ERROR
logging.level.com.example.sshcontrol=INFO
logging.level.SYSTEM_ACTIVITY=INFO

# Tắt log từ các thư viện Spring
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot=ERROR
logging.level.org.springframework.boot.devtools=OFF
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.data=ERROR

# Tắt log từ Hibernate/JPA
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.engine=ERROR
logging.level.org.hibernate.orm=ERROR

# Tắt log từ Apache Catalina (Tomcat)
logging.level.org.apache.catalina=ERROR
logging.level.org.apache=ERROR

# Tắt log từ database connection pool
logging.level.com.zaxxer.hikari=ERROR

# Tắt log từ các thư viện khác
logging.level.org.jboss=ERROR
logging.level.javax=ERROR
logging.level.jakarta=ERROR

# Format log đơn giản - chỉ hiển thị các log từ ứng dụng
logging.pattern.console=%d{HH:mm:ss} [%-5level] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%-5level] %logger{36} - %msg%n
