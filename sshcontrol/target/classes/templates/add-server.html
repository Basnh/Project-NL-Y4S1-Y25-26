<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm máy chủ mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/layout.css">
    <style>
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        .notification-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            max-width: 400px;
        }
        
        .connection-status {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            display: none;
        }
        
        .connection-status.show {
            display: block;
        }
        
        .connection-status.success {
            background-color: #d1fae5;
            border: 1px solid #6ee7b7;
            color: #047857;
        }
        
        .connection-status.error {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }
        
        .connection-status.loading {
            background-color: #fef3c7;
            border: 1px solid #fde047;
            color: #92400e;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1">
        <div class="container mx-auto px-4 py-8">
            <div class="max-w-4xl mx-auto">
                <!-- Header -->
                <div th:replace="~{fragments/header :: header('Thêm máy chủ mới', 'fas fa-plug')}"></div>
                
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <form th:action="@{/add-server}" method="post" th:object="${server}" class="space-y-6" id="addServerForm">
                        <!-- Show error message if exists -->
                        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                            <span class="block sm:inline" th:text="${error}"></span>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2" for="serverName">Tên máy chủ:</label>
                            <input type="text" th:field="*{name}" id="serverName" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200 ease-in-out" 
                                placeholder="Nhập tên máy chủ, ví dụ: Test server 1"/>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Địa chỉ IP:</label>
                            <input type="text" th:field="*{ip}" id="ip" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200 ease-in-out"
                                placeholder="Ví dụ: 192.168.1.100"/>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">SSH Username:</label>
                            <input type="text" th:field="*{sshUsername}" id="sshUsername" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200 ease-in-out"
                                placeholder="Ví dụ: ubuntu"/>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">SSH Password:</label>
                            <input type="password" th:field="*{sshPassword}" id="sshPassword" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200 ease-in-out"
                                placeholder="Nhập mật khẩu SSH"/>
                        </div>
                        
                        <!-- Connection Test Result -->
                        <div id="connectionStatus" class="connection-status"></div>
                        
                        <!-- Action Buttons -->
                        <div class="flex justify-center gap-4">
                            <button type="button" id="testConnectionBtn"
                                class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200 ease-in-out font-semibold flex items-center">
                                <i class="fas fa-plug mr-2"></i> Kiểm tra kết nối
                            </button>
                            <button type="submit" id="submitBtn"
                                class="px-6 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition duration-200 ease-in-out font-semibold flex items-center disabled:opacity-50 disabled:cursor-not-allowed"
                                disabled>
                                <i class="fas fa-save mr-2"></i> Lưu
                            </button>
                        </div>
                    </form>
                    
                    <!-- Navigation buttons -->
                    <div class="mt-8 text-center space-x-4">
                        <a th:href="@{/dashboard}" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-200 ease-in-out">
                            <i class="fas fa-tachometer-alt mr-2"></i> Quay về Dashboard
                        </a>
                        <a th:href="@{/server-list}" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition duration-200 ease-in-out">
                            <i class="fas fa-arrow-left mr-2"></i> Quay lại danh sách máy chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Enhanced Script with SSH Connection Validation -->
    <script>
        let connectionVerified = false;

        // Get form elements
        const form = document.getElementById('addServerForm');
        const testBtn = document.getElementById('testConnectionBtn');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('connectionStatus');
        
        // IP validation regex
        const ipRegex = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;

        // Test SSH Connection
        testBtn.addEventListener('click', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('serverName').value.trim();
            const ip = document.getElementById('ip').value.trim();
            const username = document.getElementById('sshUsername').value.trim();
            const password = document.getElementById('sshPassword').value.trim();
            
            // Client-side validation
            const validationError = validateForm(name, ip, username, password);
            if (validationError) {
                showStatus('error', validationError);
                return;
            }
            
            // Show loading status
            showStatus('loading', '<span class="spinner"></span> Đang kiểm tra kết nối...', false);
            testBtn.disabled = true;
            
            try {
                const response = await fetch('/api/test-connection', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ip: ip,
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('success', 
                        '<i class="fas fa-check-circle mr-2"></i><strong>✓ Kết nối thành công!</strong><br><small>' + data.message + '</small>');
                    connectionVerified = true;
                    submitBtn.disabled = false;
                    testBtn.disabled = false;
                    testBtn.innerHTML = '<i class="fas fa-check mr-2"></i> Đã xác nhận kết nối';
                    testBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                    testBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                } else {
                    showStatus('error', 
                        '<i class="fas fa-times-circle mr-2"></i><strong>✗ Kết nối thất bại!</strong><br><small>' + data.message + '</small><br><small style="margin-top: 0.5rem; display: block; opacity: 0.8;">Chi tiết: ' + (data.details || 'Unknown error') + '</small>');
                    connectionVerified = false;
                    submitBtn.disabled = true;
                    testBtn.disabled = false;
                }
            } catch (error) {
                showStatus('error', 
                    '<i class="fas fa-exclamation-circle mr-2"></i><strong>✗ Lỗi khi kiểm tra kết nối!</strong><br><small>' + error.message + '</small>');
                connectionVerified = false;
                submitBtn.disabled = true;
                testBtn.disabled = false;
            }
        });
        
        // Form submission validation
        form.addEventListener('submit', function(e) {
            if (!connectionVerified) {
                e.preventDefault();
                alert('⚠️ Vui lòng kiểm tra kết nối SSH thành công trước khi lưu!');
                return false;
            }
            return true;
        });
        
        // Helper function to validate form
        function validateForm(name, ip, username, password) {
            if (!name || name.length < 2) {
                return 'Tên máy chủ phải có ít nhất 2 ký tự';
            }
            
            if (!ip || !ipRegex.test(ip)) {
                return 'Địa chỉ IP không hợp lệ. Định dạng đúng: 192.168.1.100';
            }
            
            if (!username || username.length < 2) {
                return 'SSH Username phải có ít nhất 2 ký tự';
            }
            
            if (!password || password.length < 3) {
                return 'SSH Password phải có ít nhất 3 ký tự';
            }
            
            return null;
        }
        
        // Helper function to show status
        function showStatus(type, message, autoHide = true) {
            statusDiv.className = 'connection-status show ' + type;
            statusDiv.innerHTML = message;
            
            if (autoHide && type !== 'loading') {
                setTimeout(() => {
                    if (type === 'error') {
                        statusDiv.classList.remove('show');
                    }
                }, 5000);
            }
        }
        
        // Reset connection verification when user changes credentials
        ['ip', 'sshUsername', 'sshPassword'].forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                if (connectionVerified) {
                    connectionVerified = false;
                    submitBtn.disabled = true;
                    testBtn.innerHTML = '<i class="fas fa-plug mr-2"></i> Kiểm tra kết nối';
                    testBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                    testBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    statusDiv.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
