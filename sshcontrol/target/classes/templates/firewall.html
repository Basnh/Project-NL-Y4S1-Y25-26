<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow">
        <div class="container mx-auto px-4 py-4">
            <h1 class="text-2xl font-bold">Firewall Management</h1>
        </div>
    </nav>
    
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded shadow p-6">
            <h2 class="text-xl font-bold mb-4">Firewall Rules</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">Zone:</label>
                <select class="px-3 py-2 border border-gray-300 rounded">
                    <option>public</option>
                    <option>private</option>
                    <option>dmz</option>
                </select>
            </div>
            
            <table class="w-full border-collapse border border-gray-300">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="border border-gray-300 p-2 text-left">Type</th>
                        <th class="border border-gray-300 p-2 text-left">Service</th>
                        <th class="border border-gray-300 p-2 text-left">Port</th>
                        <th class="border border-gray-300 p-2 text-left">Protocol</th>
                        <th class="border border-gray-300 p-2 text-left">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="border border-gray-300 p-2">Service</td>
                        <td class="border border-gray-300 p-2">DNS</td>
                        <td class="border border-gray-300 p-2">53</td>
                        <td class="border border-gray-300 p-2">TCP/UDP</td>
                        <td class="border border-gray-300 p-2"><button class="text-red-600">Delete</button></td>
                    </tr>
                    <tr>
                        <td class="border border-gray-300 p-2">Service</td>
                        <td class="border border-gray-300 p-2">HTTP</td>
                        <td class="border border-gray-300 p-2">80</td>
                        <td class="border border-gray-300 p-2">TCP</td>
                        <td class="border border-gray-300 p-2"><button class="text-red-600">Delete</button></td>
                    </tr>
                    <tr>
                        <td class="border border-gray-300 p-2">Service</td>
                        <td class="border border-gray-300 p-2">HTTPS</td>
                        <td class="border border-gray-300 p-2">443</td>
                        <td class="border border-gray-300 p-2">TCP</td>
                        <td class="border border-gray-300 p-2"><button class="text-red-600">Delete</button></td>
                    </tr>
                    <tr>
                        <td class="border border-gray-300 p-2">Service</td>
                        <td class="border border-gray-300 p-2">SSH</td>
                        <td class="border border-gray-300 p-2">22</td>
                        <td class="border border-gray-300 p-2">TCP</td>
                        <td class="border border-gray-300 p-2"><button class="text-red-600">Delete</button></td>
                    </tr>
                </tbody>
            </table>
            
            <div class="mt-4 flex gap-2">
                <button class="px-4 py-2 bg-blue-600 text-white rounded">Add Rule</button>
                <button class="px-4 py-2 bg-red-600 text-white rounded">Delete Selected</button>
            </div>
        </div>
    </main>
</body>
</html>
