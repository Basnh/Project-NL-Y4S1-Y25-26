<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Admin Dashboard</h1>
            <a href="/" class="text-blue-600 hover:underline">Trang chủ</a>
        </div>
    </nav>
    
    <main class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <!-- Total Users -->
            <div class="bg-white rounded shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Tổng Users</p>
                        <p class="text-3xl font-bold text-blue-600" th:text="${totalUsers}">0</p>
                    </div>
                    <i class="fas fa-users text-4xl text-blue-200"></i>
                </div>
            </div>
            
            <!-- Admins -->
            <div class="bg-white rounded shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Admins</p>
                        <p class="text-3xl font-bold text-purple-600" th:text="${admins}">0</p>
                    </div>
                    <i class="fas fa-crown text-4xl text-purple-200"></i>
                </div>
            </div>
            
            <!-- Active Users -->
            <div class="bg-white rounded shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Users Hoạt động</p>
                        <p class="text-3xl font-bold text-green-600" th:text="${activeUsers}">0</p>
                    </div>
                    <i class="fas fa-check-circle text-4xl text-green-200"></i>
                </div>
            </div>
            
            <!-- Servers -->
            <div class="bg-white rounded shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Tổng Servers</p>
                        <p class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                    <i class="fas fa-server text-4xl text-orange-200"></i>
                </div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="bg-white rounded shadow p-6 mb-8">
            <h2 class="text-xl font-bold mb-4">Hành động nhanh</h2>
            <div class="flex gap-4">
                <a href="/admin/users" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    <i class="fas fa-list"></i> Xem danh sách Users
                </a>
            </div>
        </div>
    </main>
</body>
</html>
