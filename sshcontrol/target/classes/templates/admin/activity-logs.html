<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật ký hoạt động toàn hệ thống - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>
<body class="bg-gray-100">
    <div th:replace="fragments/header :: header('Nhật ký hoạt động toàn hệ thống', 'fas fa-history')"></div>

    <div class="min-h-screen bg-gray-100 py-10 px-6">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900">📋 Nhật ký hoạt động toàn hệ thống</h1>
                        <p class="text-gray-600 mt-2">Xem tất cả hoạt động của các người dùng trên hệ thống</p>
                    </div>
                    <a th:href="@{/admin}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                </div>
            </div>

            <!-- Activity Logs Table -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-900">Tất cả hoạt động</h2>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Người dùng</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Hành động</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Mô tả</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Trạng thái</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Thời gian</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="activity : ${activities.content}" class="border-b border-gray-200 hover:bg-gray-50 transition">
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
                                        <i class="fas fa-user mr-2"></i> <span th:text="${activity.user.username}">username</span>
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium" 
                                          th:classappend="${activity.action == 'LOGIN' ? 'bg-green-100 text-green-800' : 
                                                          activity.action == 'LOGOUT' ? 'bg-yellow-100 text-yellow-800' :
                                                          activity.action == 'SERVER_DELETE' ? 'bg-red-100 text-red-800' :
                                                          'bg-indigo-100 text-indigo-800'}">
                                        <i class="fas fa-circle mr-2" style="font-size: 0.5rem;"></i>
                                        <span th:text="${activity.action}">ACTION</span>
                                    </span>
                                </td>
                                <td class="px-6 py-4 text-gray-700">
                                    <span th:text="${activity.description}">Description</span>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                                          th:classappend="${activity.status == 'SUCCESS' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                        <i class="fas" th:classappend="${activity.status == 'SUCCESS' ? 'fa-check-circle' : 'fa-times-circle'}" style="margin-right: 0.5rem;"></i>
                                        <span th:text="${activity.status}">Status</span>
                                    </span>
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-600">
                                    <span th:text="${#temporals.format(activity.createdAt, 'dd/MM/yyyy HH:mm:ss')}">2025-11-27 16:00:00</span>
                                </td>
                            </tr>
                            <tr th:if="${activities.isEmpty()}">
                                <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                                    <i class="fas fa-inbox text-4xl mb-4 opacity-30"></i>
                                    <p>Chưa có hoạt động nào</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex items-center justify-between">
                    <div class="text-sm text-gray-600">
                        <span>Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span></span>
                    </div>
                    <div class="flex gap-2">
                        <a th:if="${currentPage > 0}" th:href="@{/admin/activity-logs(page=${currentPage - 1})}" 
                           class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition">
                            <i class="fas fa-chevron-left"></i> Trước
                        </a>
                        <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/activity-logs(page=${currentPage + 1})}" 
                           class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition">
                            Sau <i class="fas fa-chevron-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
