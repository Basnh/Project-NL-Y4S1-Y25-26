<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Quản lý Users</h1>
            <a href="/admin" class="text-blue-600 hover:underline">Quay lại</a>
        </div>
    </nav>
    
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded shadow overflow-hidden">
            <table class="w-full border-collapse">
                <thead class="bg-gray-100 border-b">
                    <tr>
                        <th class="p-4 text-left">ID</th>
                        <th class="p-4 text-left">Username</th>
                        <th class="p-4 text-left">Full Name</th>
                        <th class="p-4 text-left">Email</th>
                        <th class="p-4 text-left">Role</th>
                        <th class="p-4 text-left">Status</th>
                        <th class="p-4 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}" class="border-b hover:bg-gray-50">
                        <td class="p-4" th:text="${user.id}">1</td>
                        <td class="p-4" th:text="${user.username}">user1</td>
                        <td class="p-4" th:text="${user.fullName}">John Doe</td>
                        <td class="p-4" th:text="${user.email}">user@example.com</td>
                        <td class="p-4">
                            <span th:if="${user.admin}" class="px-3 py-1 bg-purple-100 text-purple-800 rounded text-sm font-medium">
                                <i class="fas fa-crown"></i> Admin
                            </span>
                            <span th:if="!${user.admin}" class="px-3 py-1 bg-blue-100 text-blue-800 rounded text-sm font-medium">
                                User
                            </span>
                        </td>
                        <td class="p-4">
                            <span th:if="${user.active}" class="px-3 py-1 bg-green-100 text-green-800 rounded text-sm">
                                <i class="fas fa-check-circle"></i> Active
                            </span>
                            <span th:if="!${user.active}" class="px-3 py-1 bg-red-100 text-red-800 rounded text-sm">
                                <i class="fas fa-ban"></i> Inactive
                            </span>
                        </td>
                        <td class="p-4">
                            <a th:href="'/admin/users/' + ${user.id}" class="text-blue-600 hover:underline text-sm">
                                <i class="fas fa-eye"></i> Chi tiết
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="p-4 text-center text-gray-500">Không có user nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
